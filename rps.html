<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنگ کاغذ قیچی | AmirHarter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63); 
            font-family: Tahoma; 
            color: #fff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 2rem; }
        .credit { margin-bottom: 20px; color: #ccc; font-size: 0.9rem; }
        .choices {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .choice {
            font-size: 3rem;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #f093fb;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .choice:hover { 
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        .result { font-size: 1.5rem; margin: 20px 0; }
        .back-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <h1>✊ سنگ کاغذ قیچی ✋</h1>
    <p class="credit">ساخته شده توسط AmirHarter</p>
    
    <div class="choices">
        <div class="choice" onclick="play('سنگ')">✊</div>
        <div class="choice" onclick="play('کاغذ')">✋</div>
        <div class="choice" onclick="play('قیچی')">✌️</div>
    </div>
    
    <div class="result" id="result">یکی رو انتخاب کن!</div>
    <a href="games.html" class="back-btn">بازگشت</a>
    
    <script>
        function play(userChoice) {
            const choices = ['سنگ', 'کاغذ', 'قیچی'];
            const computer = choices[Math.floor(Math.random() * 3)];
            
            let result = '';
            if (userChoice === computer) {
                result = `مساوی! ${userChoice} = ${computer} 🤝`;
            } else if (
                (userChoice === 'سنگ' && computer === 'قیچی') ||
                (userChoice === 'کاغذ' && computer === 'سنگ') ||
                (userChoice === 'قیچی' && computer === 'کاغذ')
            ) {
                result = `بردی! ${userChoice} می‌زنه ${computer} رو! 🎉`;
            } else {
                result = `باختی! ${computer} می‌زنه ${userChoice} رو! 😢`;
            }
            
            document.getElementById('result').textContent = result;
        }
    </script>
</body>
</html>
