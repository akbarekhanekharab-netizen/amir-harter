<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مار | AmirHarter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63); 
            font-family: Tahoma; 
            color: #fff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 2rem; }
        .credit { margin-bottom: 20px; color: #ccc; font-size: 0.9rem; }
        canvas { 
            border: 2px solid #f093fb; 
            border-radius: 10px; 
            background: rgba(255,255,255,0.05);
            touch-action: none;
        }
        .score { margin: 15px 0; font-size: 1.3rem; }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(2, 60px);
            gap: 5px;
            margin-top: 20px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid #f093fb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.3); }
        .back-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <h1>🐍 بازی مار</h1>
    <p class="credit">ساخته شده توسط AmirHarter</p>
    <div class="score" id="score">امتیاز: 0</div>
    <canvas id="canvas" width="300" height="300"></canvas>
    
    <div class="controls">
        <div></div>
        <div class="ctrl-btn" onclick="changeDirection('up')">⬆️</div>
        <div></div>
        <div class="ctrl-btn" onclick="changeDirection('left')">⬅️</div>
        <div class="ctrl-btn" onclick="changeDirection('down')">⬇️</div>
        <div class="ctrl-btn" onclick="changeDirection('right')">➡️</div>
    </div>
    
    <a href="games.html" class="back-btn">بازگشت</a>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        
        let snake = [{x: 5, y: 5}];
        let food = {x: 10, y: 10};
        let direction = 'right';
        let score = 0;
        
        function changeDirection(dir) {
            if (dir === 'up' && direction !== 'down') direction = 'up';
            if (dir === 'down' && direction !== 'up') direction = 'down';
            if (dir === 'left' && direction !== 'right') direction = 'left';
            if (dir === 'right' && direction !== 'left') direction = 'right';
        }
        
        function draw() {
            ctx.clearRect(0, 0, 300, 300);
            ctx.fillStyle = '#ff4757';
            ctx.fillRect(food.x * 15, food.y * 15, 15, 15);
            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? '#f093fb' : '#4facfe';
                ctx.fillRect(seg.x * 15, seg.y * 15, 15, 15);
            });
        }
        
        function update() {
            const head = {...snake[0]};
            if (direction === 'right') head.x++;
            if (direction === 'left') head.x--;
            if (direction === 'up') head.y--;
            if (direction === 'down') head.y++;
            
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = `امتیاز: ${score}`;
                food = {
                    x: Math.floor(Math.random() * 20),
                    y: Math.floor(Math.random() * 20)
                };
            } else {
                snake.pop();
            }
            
            if (head.x < 0 || head.x > 19 || head.y < 0 || head.y > 19) {
                alert('باختی! امتیاز: ' + score);
                snake = [{x: 5, y: 5}];
                score = 0;
                scoreEl.textContent = 'امتیاز: 0';
                direction = 'right';
            }
        }
        
        setInterval(() => {
            update();
            draw();
        }, 200);
        
        draw();
    </script>
</body>
</html>
