<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی‌های AmirHarter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            font-family: Tahoma; 
            color: #fff; 
            min-height: 100vh; 
            text-align: center;
            padding: 20px;
        }
        h1 { 
            font-size: 2.5rem; 
            margin: 30px 0; 
            background: linear-gradient(45deg, #f093fb, #ffd700, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { margin-bottom: 30px; color: #ccc; font-size: 1.1rem; }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .game-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 30px 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .game-card:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .game-icon { font-size: 4rem; margin-bottom: 15px; }
        .game-name { font-size: 1.3rem; font-weight: bold; }
        .back-btn {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 30px;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🎮 بازی‌های AmirHarter</h1>
    <p class="subtitle">ساخته شده توسط AmirHarter</p>
    
    <div class="games-grid">
        <div class="game-card" onclick="window.location.href='tictactoe.html'">
            <div class="game-icon">⭕</div>
            <div class="game-name">دوز</div>
        </div>
        
        <div class="game-card" onclick="window.location.href='snake.html'">
            <div class="game-icon">🐍</div>
            <div class="game-name">مار</div>
        </div>
        
        <div class="game-card" onclick="alert('به زودی!')">
            <div class="game-icon">🎯</div>
            <div class="game-name">حدس عدد</div>
        </div>
        
        <div class="game-card" onclick="alert('به زودی!')">
            <div class="game-icon">✊</div>
            <div class="game-name">سنگ کاغذ قیچی</div>
        </div>
    </div>
    
    <a href="index.html" class="back-btn">🏠 بازگشت به سایت اصلی</a>
</body>
</html>
