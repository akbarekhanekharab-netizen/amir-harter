<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوز | AmirHarter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63); 
            font-family: Tahoma; 
            color: #fff; 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; font-size: 2rem; }
        .credit { margin-bottom: 20px; color: #ccc; font-size: 0.9rem; }
        .mode-select { margin-bottom: 20px; display: flex; gap: 15px; }
        .mode-btn { 
            padding: 10px 25px; 
            background: rgba(255,255,255,0.1); 
            border: 2px solid #f093fb; 
            border-radius: 25px; 
            color: #fff; 
            cursor: pointer; 
            font-weight: bold;
        }
        .mode-btn.active { background: linear-gradient(45deg, #f093fb, #f5576c); }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            background: rgba(255,255,255,0.1);
            border: 2px solid #f093fb;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .cell:hover { background: rgba(255,255,255,0.2); }
        .status { margin: 20px 0; font-size: 1.2rem; }
        .back-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
        }
    </style>
</head>
<body>
    <h1>⭕ بازی دوز ❌</h1>
    <p class="credit">ساخته شده توسط AmirHarter</p>
    
    <div class="mode-select">
        <button class="mode-btn active" onclick="setMode('bot', this)">🤖 با ربات</button>
        <button class="mode-btn" onclick="setMode('2p', this)">👥 دو نفره</button>
    </div>
    
    <div class="status" id="status">نوبت X</div>
    <div class="board" id="board"></div>
    <a href="games.html" class="back-btn">بازگشت</a>
    
    <script>
        let board = ['', '', '', '', '', '', '', '', ''];
        let current = 'X';
        let mode = 'bot';
        
        function setMode(m, btn) {
            mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            resetGame();
        }
        
        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            current = 'X';
            document.getElementById('status').textContent = 'نوبت X';
            render();
        }
        
        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board.forEach((cell, i) => {
                const div = document.createElement('div');
                div.className = 'cell';
                div.textContent = cell;
                div.onclick = () => play(i);
                boardEl.appendChild(div);
            });
        }
        
        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let w of wins) {
                if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) {
                    return board[w[0]];
                }
            }
            return null;
        }
        
        function botPlay() {
            const empty = board.map((c, i) => c === '' ? i : null).filter(c => c !== null);
            if (empty.length === 0) return;
            const randomIndex = empty[Math.floor(Math.random() * empty.length)];
            board[randomIndex] = 'O';
            render();
            
            const winner = checkWin();
            if (winner) {
                document.getElementById('status').textContent = `برنده: ${winner}! 🎉`;
                return;
            }
            if (!board.includes('')) {
                document.getElementById('status').textContent = 'مساوی! 🤝';
                return;
            }
            current = 'X';
            document.getElementById('status').textContent = 'نوبت X';
        }
        
        function play(i) {
            if (board[i] !== '') return;
            board[i] = current;
            render();
            
            const winner = checkWin();
            if (winner) {
                document.getElementById('status').textContent = `برنده: ${winner}! 🎉`;
                return;
            }
            
            if (!board.includes('')) {
                document.getElementById('status').textContent = 'مساوی! 🤝';
                return;
            }
            
            if (mode === 'bot' && current === 'X') {
                current = 'O';
                document.getElementById('status').textContent = 'ربات فکر می‌کنه...';
                setTimeout(botPlay, 500);
            } else {
                current = current === 'X' ? 'O' : 'X';
                document.getElementById('status').textContent = `نوبت ${current}`;
            }
        }
        
        render();
    </script>
</body>
</html>
